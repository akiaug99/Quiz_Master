<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文职面试答题系统</title>
    <link rel="manifest" href="/assets/manifest-CYXj5RF4.json">
  <link rel="stylesheet" crossorigin href="/assets/index-DtN9rKbl.css">
<link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
<body>
    <div id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <button class="nav-btn active" data-page="questions">题库管理</button>
            <button class="nav-btn" data-page="exam">开始答题</button>
            <button class="nav-btn" data-page="records">答题记录</button>
            <button class="nav-btn" data-page="settings">设置</button>
        </nav>

        <!-- 题库管理页面 -->
        <section id="page-questions" class="page active">
            <h2>题库管理</h2>
            <div class="toolbar">
                <button id="btn-add" class="btn primary">添加题目</button>
                <button id="btn-import" class="btn">导入</button>
                <button id="btn-export" class="btn">导出</button>
                <button id="btn-clear" class="btn danger">清空题库</button>
            </div>
            <div id="question-list" class="question-list"></div>
        </section>

        <!-- 答题页面 -->
        <section id="page-exam" class="page">
            <div id="exam-setup">
                <h2>开始答题</h2>
                <div class="settings-form">
                    <label>
                        抽题数量:
                        <input type="number" id="setting-count" min="1" max="10" value="5">
                    </label>
                    <label>
                        倒计时(分钟):
                        <input type="number" id="setting-timer" min="5" max="60" value="20">
                    </label>
                    <button id="btn-start-exam" class="btn primary">开始抽题</button>
                </div>
            </div>
            <div id="exam-content" class="hidden">
                <div class="exam-header">
                    <div class="timer">倒计时: <span id="timer-display">20:00</span></div>
                    <div class="progress">题目: <span id="current-num">1</span>/<span id="total-num">5</span></div>
                </div>
                <div class="exam-content-area">
                    <div class="question-box">
                        <p id="exam-question"></p>
                    </div>
                    <div class="answer-section">
                        <textarea id="answer-input" placeholder="请输入答案..."></textarea>
                        <button id="btn-record" class="btn record-btn">🎤 开始录音</button>
                        <div id="recording-status" class="recording-status"></div>
                    </div>
                </div>
                <div class="exam-nav">
                    <button id="btn-prev" class="btn">上一题</button>
                    <button id="btn-next" class="btn">下一题</button>
                    <button id="btn-submit" class="btn primary">提交答卷</button>
                </div>
            </div>
        </section>

        <!-- 答题记录页面 -->
        <section id="page-records" class="page">
            <h2>答题记录</h2>
            <div class="toolbar">
                <button id="btn-clear-records" class="btn danger">清空全部记录</button>
            </div>
            <div id="records-list" class="records-list"></div>
        </section>

        <!-- 设置页面 -->
        <section id="page-settings" class="page">
            <h2>设置</h2>
            <div class="settings-form">
                <label>
                    默认抽题数量:
                    <input type="number" id="default-count" min="1" max="10" value="5">
                </label>
                <label>
                    默认倒计时(分钟):
                    <input type="number" id="default-timer" min="5" max="60" value="20">
                </label>
                <button id="btn-save-settings" class="btn primary">保存设置</button>
            </div>
        </section>
    </div>

    <!-- 导入弹窗 -->
    <div id="modal-import" class="modal">
        <div class="modal-content">
            <h3>导入题目</h3>
            <select id="import-type">
                <option value="json">JSON</option>
                <option value="txt">TXT (每行一个)</option>
                <option value="excel">Excel</option>
                <option value="custom">长文本自定义分隔符</option>
            </select>
            <div id="custom-separator" class="hidden">
                <input type="text" id="separator-input" placeholder="输入分隔符，如 === 或 ;;">
            </div>
            <textarea id="import-content" placeholder="粘贴题目内容..."></textarea>
            <div id="import-preview" class="preview-box hidden">
                <h4>预览 (共 <span id="preview-count">0</span> 题)</h4>
                <ul id="preview-list"></ul>
            </div>
            <div class="modal-actions">
                <button id="btn-preview" class="btn">预览</button>
                <button id="btn-confirm-import" class="btn primary">确认导入</button>
                <button id="btn-cancel-import" class="btn">取消</button>
            </div>
        </div>
    </div>

    <!-- 添加题目弹窗 -->
    <div id="modal-add" class="modal">
        <div class="modal-content">
            <h3>添加题目</h3>
            <textarea id="new-question" placeholder="输入题目内容..."></textarea>
            <div class="modal-actions">
                <button id="btn-save-question" class="btn primary">保存</button>
                <button id="btn-cancel-add" class="btn">取消</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/recorder.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
